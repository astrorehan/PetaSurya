      mencatat dokumen diperbarui 2 September 2021. Indeks resmi
      https://gatrik.esdm.go.id/download-index/faktor-emisi-pembangkit-listrik
      pada tanggal ambil memuat enam dokumen tahun 2011–2019; ini yang
