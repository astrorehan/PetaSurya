      publikasi lebih baru di tempat lain. Tautan lama assets/uploads kini
      mengembalikan halaman HTML; URL storage ini diperoleh dari indeks
      resmi yang baru dan berhasil mengunduh PDF. Untuk skenario PLTS
      dengan pendekatan CM ex-ante bobot 0,75/0,25, kolom yang sesuai adalah
      0,84; ex-post dengan bobot sama adalah 0,86. Pemilihan pendekatan harus
      disebutkan, bukan mengambil 0,94 dari kolom 0,5/0,5 tanpa alasan.
      Jangan menghitung ulang kolom ex-ante dari OM/BM ex-post yang tampil.
      Sumber menyatakan CO2, bukan inventaris semua GRK dalam CO2e.
      Angka contoh 0,76 belum didukung baris Sumatera ini.

