# Registri sumber angka eksternal PetaSurya.
# Setiap konstanta yang dipakai mesin atau antarmuka WAJIB punya entri di sini.
# Tes CI menolak entri tanpa penerbit, url, dan tanggal diambil.
#
# Format tiap entri:
#   - id: tarif_pln_r1_1300va          # kunci yang dirujuk kode
#     nama: Tarif tenaga listrik R-1/TR 1.300 VA
#     nilai:                           # kosong bila belum diverifikasi manusia
#     satuan: Rp/kWh
#     penerbit: PT PLN (Persero)
#     url: https://...
#     tahun: 2026
#     diambil: 2026-09-13              # tanggal angka dibaca dari sumber
#     dipakai_untuk: L4 ekonomi, penghematan tagihan
#     status: belum diverifikasi       # terverifikasi | belum diverifikasi
#     catatan: ...

sumber:
  - id: osm_overpass_bangunan_bengkulu
    nama: Jejak bangunan OpenStreetMap, Kandang Limun, Kota Bengkulu (3 way)
    nilai:
    satuan: poligon WGS84
    penerbit: OpenStreetMap contributors (ODbL 1.0)
    url: https://overpass-api.de/api/interpreter
    tahun: 2026
    diambil: 2026-09-15
    dipakai_untuk: L1 geo, fixture data/fixtures/bangunan (way/1145010599, way/991016391, way/1146141501)
    status: terverifikasi
    catatan: >-
      Kueri "way(<id>);out meta geom;" — respons mentah tersimpan di
      data/fixtures/bangunan/mentah/. Luas jejak dihitung skrip
      services/engine/scripts/buat_fixture_bangunan.py (shoelace ekuirektangular lokal).
      Atribusi wajib "© OpenStreetMap contributors" di antarmuka.

  - id: osm_overpass_batas_kota_bengkulu
    nama: Batas administratif Kota Bengkulu dan kecamatan yang tersedia di OSM
    nilai:
    satuan: poligon WGS84
    penerbit: OpenStreetMap contributors (ODbL 1.0)
    url: https://overpass-api.de/api/interpreter
    tahun: 2026
    diambil: 2026-09-21
    dipakai_untuk: L1 geo, Mode Kota /kota/[kode], fixture data/fixtures/wilayah
    status: terverifikasi
    catatan: >-
      Batas kota dari relation/16196019 (official_name=Kota Bengkulu).
      Batas admin_level=6 yang tersedia di sekitar kota: relation/16196021
      Muara Bangka Hulu, relation/16196022 Sungai Serut, dan relation/16196023
      Singaran Pati. Respons mentah dan kueri disimpan di
      data/fixtures/wilayah/. Batas yang belum tersedia di OSM tidak diisi
      dengan geometri rekaan.

  - id: nasa_power_hourly_bengkulu_2024
    nama: Iradiansi dan cuaca hourly NASA POWER, titik Bengkulu
    nilai:
    satuan: GHI/DNI/DHI Wh/m² per jam; suhu °C; angin m/s
    penerbit: NASA Langley Research Center POWER Project
    url: https://power.larc.nasa.gov/api/temporal/hourly/point
    tahun: 2024
    diambil: 2026-09-21
    dipakai_untuk: L3 fisika, pembanding transposisi POA terhadap pvlib
    status: terverifikasi
    catatan: >-
      Query hourly 20240101–20241231, UTC, community=RE, latitude=-3.76268,
      longitude=102.27168, parameter ALLSKY_SFC_SW_DWN, ALLSKY_SFC_SW_DNI,
      ALLSKY_SFC_SW_DIFF, T2M, dan WS2M. Respons mentah tersimpan di
      data/fixtures/cuaca/mentah/nasa-power-bengkulu-2024.json.

  - id: contoh_cetak_biru_simulasi
    nama: Contoh respons /simulate dan /analyze dari cetak biru §04
    nilai:
    satuan:
    penerbit: cetak biru internal PetaSurya (bukan sumber eksternal)
    url: https://petasurya.id/metodologi
    tahun: 2026
    diambil: 2026-09-15
    dipakai_untuk: fixture data/fixtures/simulasi dan data/fixtures/analisis selama mesin L3–L5 belum hijau
    status: belum diverifikasi
    catatan: >-
      Angka ilustrasi, bukan hasil hitungan. Di antarmuka WAJIB berlabel "contoh".
      tarif_rp_kwh 1454,3 dan ef_grid 0,76 tCO2e/MWh di dalamnya hanya menurunkan
      contoh itu sendiri; nilai resmi menunggu entri tarif PLN dan faktor emisi
      Sumatera yang diverifikasi manusia.
