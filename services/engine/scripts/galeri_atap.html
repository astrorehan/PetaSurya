<!doctype html><html lang="id"><meta charset="utf-8"><title>Acuan atap · galeri</title>
<style>:root{color-scheme:dark}body{font:14px system-ui;margin:12px;background:#17191b;color:#f5f0e8}h1{font-size:22px;margin:4px 0 12px}#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{min-width:0}svg{width:100%;display:block;background:#303437}input,textarea,button,select{font:inherit;background:#24282a;color:inherit;border:1px solid #888;border-radius:6px;padding:8px;min-height:44px}textarea{width:100%;box-sizing:border-box;height:60px}header{display:flex;gap:8px;align-items:center;margin-bottom:12px}.status{min-height:20px;margin:4px 0}.baris{display:flex;gap:4px}.baris input{min-width:0;flex:1}button{cursor:pointer}path{stroke:#ffc56c;fill:#ffbc4b22;stroke-width:1;vector-effect:non-scaling-stroke}a{color:#ffc56c}</style>
<header><h1>Acuan visual · citra tanpa prediksi</h1><select aria-label="Kelompok sampel" id="page"><option value="0">1–6</option><option value="1">7–12</option><option value="2">13–18</option><option value="3">19–24</option><option value="4">25–30</option></select><a href="/">Editor rinci</a></header><div id="grid"></div>
<script>
let all=[];const grid=document.getElementById('grid');function show(){grid.innerHTML='';const start=Number(document.getElementById('page').value)*6;all.slice(start,start+6).forEach((s,j)=>{const i=start+j+1,c=s.crop,id=s.id;const card=document.createElement('section');card.className='card';card.innerHTML='<strong>'+i+' · '+id+'</strong><svg viewBox="'+c.join(' ')+'" role="img" aria-label="Citra sampel '+i+'"><image href="/citra/'+id+'" width="640" height="480"/><g class="outline"></g><circle cx="'+s.penanda[0]+'" cy="'+s.penanda[1]+'" r="1" fill="white" stroke="black" stroke-width=".4"/></svg><p class="status">Memuat citra · '+id+'</p><textarea aria-label="Batas sampel '+i+'" placeholder="Titik persen crop: [[x,y],...]"></textarea><div class="baris"><input aria-label="Catatan sampel '+i+'" placeholder="Catatan / alasan ambigu"><button class="preview">Tinjau</button><button class="save">Simpan</button><button class="ambiguous">Ambigu</button></div>';grid.appendChild(card);const image=card.querySelector('image'),status=card.querySelector('.status');image.onload=()=>{status.textContent='Citra siap · '+id+' · '+s.status};image.onerror=()=>status.textContent='Citra gagal · '+id;function rings(){const raw=JSON.parse(card.querySelector('textarea').value);return [[raw.map(p=>[Math.round((c[0]+p[0]/100*c[2])*100)/100,Math.round((c[1]+p[1]/100*c[3])*100)/100])]]}card.querySelector('.preview').onclick=()=>{try{const r=rings()[0][0];card.querySelector('.outline').innerHTML='<path d="M'+r.map(p=>p.join(',')).join('L')+'Z"/>'}catch{status.textContent='Koordinat belum valid'}};async function save(ambiguous){try{const r=await fetch('/acuan/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:ambiguous?'ambigu':'digambar',rings:ambiguous?[]:rings(),catatan:card.querySelector('input').value})});const d=await r.json();if(!r.ok)throw Error(d.detail);status.textContent='Tersimpan · '+id+' · '+(ambiguous?'ambigu':'digambar')}catch(e){status.textContent=e.message}}card.querySelector('.save').onclick=()=>save(false);card.querySelector('.ambiguous').onclick=()=>save(true)})}document.getElementById('page').onchange=show;fetch('/sampel').then(r=>r.json()).then(data=>{all=data;show()});
</script></html>
